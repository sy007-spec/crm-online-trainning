# Use dedicated access_log/error_log files under /var/log/crm-training.
# Run hourly with a separate state file; do not include in a daily global rule.
/var/log/crm-training/*.log {
 hourly
 rotate 167
 maxage 6
 missingok
 notifempty
 compress
 create 0640 www-data adm
 sharedscripts
 postrotate
  /usr/sbin/nginx -s reopen
 endscript
}
