<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="小圆 XiaoYuan，温暖陪伴型导师吉祥物">
  <!-- ground shadow -->
  <ellipse cx="60" cy="110" rx="36" ry="5" fill="#F0E4D3"/>
  <!-- arms (behind body) -->
  <path d="M22 66 Q12 76 18 86" stroke="#E8A23B" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M98 66 Q108 76 102 86" stroke="#E8A23B" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="17.5" cy="87" r="5" fill="#E8A23B"/>
  <circle cx="102.5" cy="87" r="5" fill="#E8A23B"/>
  <!-- body -->
  <circle cx="60" cy="58" r="45" fill="#F0B848"/>
  <!-- belly -->
  <ellipse cx="60" cy="72" rx="27" ry="23" fill="#FFF3D5"/>
  <!-- sparkles -->
  <path d="M28 26 l2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2 -5.8 -5.8 -2.2 5.8 -2.2 Z" fill="#F7D9A8"/>
  <path d="M96 18 l1.7 4.5 4.5 1.7 -4.5 1.7 -1.7 4.5 -1.7 -4.5 -4.5 -1.7 4.5 -1.7 Z" fill="#E98358" opacity="0.85"/>
  <!-- eyes -->
  <circle cx="47" cy="50" r="6.5" fill="#5A3E1B"/>
  <circle cx="73" cy="50" r="6.5" fill="#5A3E1B"/>
  <circle cx="49.3" cy="47.6" r="2.2" fill="#FFFDF9"/>
  <circle cx="75.3" cy="47.6" r="2.2" fill="#FFFDF9"/>
  <!-- blush -->
  <ellipse cx="37" cy="62" rx="5.5" ry="3.8" fill="#E98358" opacity="0.5"/>
  <ellipse cx="83" cy="62" rx="5.5" ry="3.8" fill="#E98358" opacity="0.5"/>
  <!-- smile -->
  <path d="M50 68 Q60 78 70 68" stroke="#5A3E1B" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- graduation cap -->
  <path d="M36 33 L60 22.5 L84 33 L60 43.5 Z" fill="#8A5B22"/>
  <path d="M60 43.5 L60 55" stroke="#8A5B22" stroke-width="3" fill="none"/>
  <path d="M84 33 L88.5 39.5 L84 44 Z" fill="#8A5B22"/>
  <circle cx="90" cy="41" r="4" fill="#E98358"/>
  <!-- pointer in right hand -->
  <rect x="86" y="70" width="26" height="3.5" rx="1.75" fill="#8A5B22" transform="rotate(24 99 72)"/>
</svg>
